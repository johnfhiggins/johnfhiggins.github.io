name: Update JOE listings site

on:
  schedule:
    # Runs every 4 hours
    - cron: "30 */4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "R/**"
      - ".github/workflows/update-site.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation fonts-dejavu-core fonts-noto

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.0"

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-pkgs-${{ hashFiles('R/generate_plots.R') }}

      - name: Install R dependencies
        run: |
          Rscript -e 'install.packages(c("ggplot2", "data.table", "lubridate","snakecase","stringr","svglite","readxl","ragg"))'

      - name: Run scrape + plot generation
        run: Rscript R/generate_plots.R

      - name: Clean up old hashed plots from previous builds
        run: |
          for filepath in joe-listings/plots/*; do
            shopt -s extglob
            [ -f "$filepath" ] || continue
            filename=$(basename "$filepath")
            ext="${filename##*.}"
            echo "Asset: $filename"
            if [[ "$ext" =~ ^(png|txt)$ ]] && [[ "$filename" =~ -[0-9]{10}\.[a-zA-Z]+$ ]]; then
              echo "Deleting stale hashed asset: $filename"
              rm "$filepath"
            fi
          done

      - name: Hash dynamic images to bypass GitHub Cache
        run: |
          HASH=$(date +%s)
          echo "Current hash: $HASH"
          shopt -s extglob
          for filepath in joe-listings/plots/*.@(png|txt); do
            [ -f "$filepath" ] || break
            filename=$(basename "$filepath")
            echo "File: $filename"
            ext="${filename##*.}"
            basename="${filename%.*}"
            new_filename="${basename}-${HASH}.${ext}"
            new_filepath="joe-listings/plots/${new_filename}"
            mv "$filepath" "$new_filepath"
          done

          sed -i "s/cumul_postings-[0-9]*\.png/cumul_postings-${HASH}.png/" joe-listings/index.html
          sed -i "s/const uq_hash = \"[0-9]*\";/const uq_hash = \"${HASH}\";/" joe-listings/index.html
          echo "Now $HASH"

      - name: Commit updated plots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add joe-listings
          git diff --quiet --cached || git commit -m "Auto-update JOE plots [skip ci]"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."   # adjust if your Pages source is a subfolder, e.g. "docs"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
