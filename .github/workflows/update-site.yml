name: Update JOE listings site

on:
  schedule:
    # Runs every 4 hours
    - cron: "30 */4 * * *"
  workflow_dispatch: 
  push:
    branches: [main]
    paths:
      - "R/**"
      - ".github/workflows/update-site.yml"

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation fonts-dejavu-core fonts-noto

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.0"

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-pkgs-${{ hashFiles('R/generate_plots.R') }}

      - name: Install R dependencies
        run: |
          Rscript -e 'install.packages(c("ggplot2", "data.table", "lubridate","snakecase","stringr","svglite","readxl","ragg"))'

      - name: Run scrape + plot generation
        run: Rscript R/generate_plots.R
      
      - name: Hash dynamic images to bypass GitHub Cache
        run: |
          # 1. Generate a single unique hash for this entire build run
          HASH=$(date +%s)
          
          # 2. Loop through all files matching the prefix inside the images folder
          for filepath in joe-listings/plots/*.@(png|txt); do
            
            # Make sure it's actually a file, not a directory
            [ -f "$filepath" ] || break
            
            # Extract filename
            filename=$(basename "$filepath")
            
            # Extract extension
            ext="${filename##*.}"
            
            # Extract base name without extension (e.g., updated-banner)
            basename="${filename%.*}"
            
            # Define the new hashed filename (e.g., updated-banner-1726848000.png)
            new_filename="${basename}-${HASH}.${ext}"
            new_filepath="joe-listings/plots/${new_filename}"
            
            # Rename the file on disk
            mv "$filepath" "$new_filepath"
            
            # 3. Update all references in your HTML files
            # This searches for the exact original path and replaces it with the hashed path
            sed -i "s|joe-listings/plots/${filename}|joe-listings/plots/${new_filename}|g" joe-listings/index.html
            
          done

      - name: Commit updated plots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add joe-listings/plots
          git add joe-listings/data
          git diff --quiet --cached || git commit -m "Auto-update JOE plots [skip ci]"
          git push


      - name: purge
        run: |
          curl -sL "https://github.com/${GITHUB_REPOSITORY}" |
          grep -oE '<img src="https?://camo.githubusercontent.com/[^"]+' |
          sed -e 's/<img src="//' |
          xargs -I % curl -sX PURGE "%"
     
     
